plugins {
    id 'java-library'
    id 'idea'
    id 'fabric-loom' version "${loom_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'neoforge_compat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {
    accessWidenerPath = file("src/main/resources/neoforge_compat.accesswidener")
}

repositories {
    maven { url = "https://maven.ladysnake.org/releases" } // cardinal-components (trinkets dep)
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // forgeconfigapiport
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // TypeResolver - the same lambda generic-resolution helper NeoForge's event
    // bus uses to discover a method-reference listener's event type.
    implementation "net.jodah:typetools:0.6.3"
    include "net.jodah:typetools:0.6.3"
    localRuntime "net.jodah:typetools:0.6.3"

    // Trinkets (Curios emulation target) + its cardinal-components runtime.
    // modCompileOnly so the mod jars don't leak unmapped onto dependents' runtime
    // classpath - the root project supplies them as real mod deps.
    modCompileOnly files("${rootDir}/libs/trinkets-${trinkets_version}.jar")
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.0"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.0"

    // Forge Config API Port supplies the net.neoforged config API the shim re-exports
    modCompileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.4"
    compileOnly files("${rootDir}/libs/fcap-nested/core-3.8.0.jar")
    compileOnly files("${rootDir}/libs/fcap-nested/toml-3.8.0.jar")

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "org.checkerframework:checker-qual:3.43.0"
    compileOnly "com.google.j2objc:j2objc-annotations:3.0.0"
    compileOnly "com.google.errorprone:error_prone_annotations:2.36.0"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly files("${rootDir}/libs/trinkets-${trinkets_version}.jar")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
    implementation "com.google.code.gson:gson:2.10.1"
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : "NeoForge Compat (Fabric)",
                "Specification-Vendor"  : mod_authors,
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : mod_authors
        ])
    }
}

test {
    useJUnitPlatform()
}
