plugins {
    id 'java-library'
    id 'idea'
    id 'fabric-loom' version "${loom_version}"
}

version = '1.0.4+fabric.1.21.1'
group = mod_group_id

base {
    archivesName = 'chronomancy'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {
    accessWidenerPath = file("src/main/resources/chronomancy.accesswidener")
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.ladysnake.org/releases" } // cardinal-components (trinkets dep)
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.blamejared.com/" } // JEI
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // NeoForge compat shim (named/mojmap variant for compilation)
    implementation(project(path: ':neoforge-compat', configuration: 'namedElements')) {
        transitive = false
    }
    // Iron's Spells (root project) — the addon plugs into its API
    implementation(project(path: ':', configuration: 'namedElements')) {
        transitive = false
    }

    // Curios compat -> Trinkets (compile-only)
    modCompileOnly files("${rootDir}/libs/trinkets-${trinkets_version}.jar")
    // Forge Config API Port supplies net.neoforged.fml.config.* / ModConfigSpec
    modCompileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.4"
    compileOnly files("${rootDir}/libs/fcap-nested/core-3.8.0.jar")
    compileOnly files("${rootDir}/libs/fcap-nested/toml-3.8.0.jar")

    // GeckoLib (entities/spells are geo-animated)
    modCompileOnly files("${rootDir}/libs/geckolib-fabric-1.21.1-${geckolib_version}.jar")

    // JEI integration (compile-only, neoforge-api like alexscaves)
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247"
    compileOnly "mezz.jei:jei-1.21.1-neoforge:19.21.0.247"
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.21.0.247"

    // MixinExtras annotations (@WrapOperation) — fabric loader provides runtime
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.3.6"

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "org.checkerframework:checker-qual:3.43.0"
    compileOnly "com.google.j2objc:j2objc-annotations:3.0.0"
    compileOnly "com.google.errorprone:error_prone_annotations:2.36.0"
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : "Iron's Spells 'n Spellbooks: Chronomancy",
                "Specification-Vendor"  : "adesanyua",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : "adesanyua"
        ])
    }
}
