plugins {
    id 'java-library'
    id 'idea'
    id 'fabric-loom' version "${loom_version}"
}

version = '4.4.0.1+fabric.1.21.1'
group = mod_group_id

base {
    archivesName = 'traveloptics'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {
    accessWidenerPath = file("src/main/resources/traveloptics.accesswidener")
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.ladysnake.org/releases" } // cardinal-components (trinkets dep)
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // NeoForge compat shim (named/mojmap variant for compilation)
    implementation(project(path: ':neoforge-compat', configuration: 'namedElements')) {
        transitive = false
    }
    // Iron's Spells (root project) — the addon plugs into its API
    implementation(project(path: ':', configuration: 'namedElements')) {
        transitive = false
    }
    // Cataclysm integration content (summons, particles, sounds)
    implementation(project(path: ':mods:cataclysm', configuration: 'namedElements')) {
        transitive = false
    }
    // Lionfish API (IAnimatedEntity and friends used through cataclysm entity supertypes)
    implementation(project(path: ':mods:lionfishapi', configuration: 'namedElements')) {
        transitive = false
    }

    // Curios compat -> Trinkets (compile-only)
    modCompileOnly files("${rootDir}/libs/trinkets-${trinkets_version}.jar")
    // Forge Config API Port supplies net.neoforged.fml.config.* / ModConfigSpec
    modCompileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.4"
    compileOnly files("${rootDir}/libs/fcap-nested/core-3.8.0.jar")
    compileOnly files("${rootDir}/libs/fcap-nested/toml-3.8.0.jar")

    // GeckoLib (entities/spells are geo-animated)
    modCompileOnly files("${rootDir}/libs/geckolib-fabric-1.21.1-${geckolib_version}.jar")

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "org.checkerframework:checker-qual:3.43.0"
    compileOnly "com.google.j2objc:j2objc-annotations:3.0.0"
    compileOnly "com.google.errorprone:error_prone_annotations:2.36.0"
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : "T.O Magic n' Extras",
                "Specification-Vendor"  : "TeamTraveler",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : "TeamTraveler"
        ])
    }
}
