pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'irons-spells-n-spellbooks'

include 'neoforge-compat'
include 'mods:lionfishapi'
include 'mods:placebo'
include 'mods:apothic_attributes'
include 'mods:citadel'
include 'mods:cataclysm'
