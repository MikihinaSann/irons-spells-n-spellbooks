plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom' version "${loom_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {
    accessWidenerPath = file("src/main/resources/irons_spellbooks.accesswidener")

    mods {
        // ISS is the root mod (implicit); neoforge_compat comes from the subproject's sources
        neoforge_compat {
            sourceSet project(':neoforge-compat').sourceSets.main
        }
    }

    runs {
        configureEach {
            ideConfigGenerated true
        }
        client {
            client()
            vmArgs "-Diss.autojoin=127.0.0.1:25565"
        }
        server {
            server()
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = "https://maven.ladysnake.org/releases" } // cardinal-components (trinkets dep)
    maven { url = "https://maven.blamejared.com" }         // JEI
    maven { url = "https://maven.kosmx.dev/" }
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // forgeconfigapiport (tacz dep)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Sources are written in Mojang (official) mappings; kept identical to upstream.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // namedElements = the named (dev) variant of the compat jar
    implementation(project(path: ":neoforge-compat", configuration: "namedElements")) {
        transitive = false
    }
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Local mod jars (Fabric builds) — Loom remaps file deps in mod configurations
    modImplementation files("libs/geckolib-fabric-1.21.1-${geckolib_version}.jar")
    modImplementation files("libs/player-animation-lib-fabric-${player_animator_version}.jar")
    modImplementation files("libs/trinkets-${trinkets_version}.jar")
    modImplementation files("libs/biolith-fabric-${biolith_version}.jar")
    modImplementation files("libs/azurelib-fabric-1.21.1-${azurelib_version}.jar")
    modImplementation files("libs/cloth-config-${cloth_config_version}-fabric.jar")
    // cloth-config JIJ dep (not extracted by loom for files() deps)
    implementation files("libs/cloth-nested/basic-math-0.6.1.jar")

    // Optional compat bases — merged addons gate themselves on these being loaded
    modImplementation files("libs/epicfight-fabric-21.17.3.jar")
    modImplementation files("libs/tacz-refabricated-1.21.1-0.7.0.jar")
    // tacz JIJ deps (loom does not extract nested jars from files() deps)
    modImplementation files("libs/tacz-nested/luaj-core-3.0.8-figura.jar")
    modImplementation files("libs/tacz-nested/luaj-jse-3.0.8-figura.jar")
    modImplementation files("libs/tacz-nested/simplebedrockmodel-fabric-2.3.0.1+mc1.21.1.jar")
    modImplementation files("libs/tacz-nested2/mae-1.1.1.jar")
    modImplementation files("libs/tacz-nested/bcel-6.6.1.jar")
    modImplementation files("libs/tacz-nested/commons-math3-3.6.1.jar")
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.4"
    // FCAP nested nightconfig jars (loom does not extract JIJ from maven mods)
    implementation files("libs/fcap-nested/core-3.8.0.jar")
    implementation files("libs/fcap-nested/toml-3.8.0.jar")

    // Trinkets runtime dep: cardinal-components (nested jars are stripped by Loom remap)
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.0"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.0"

    // NightConfig — TOML config read/write for the ModConfigSpec stub
    include implementation("com.electronwill.night-config:core:3.8.0")
    include implementation("com.electronwill.night-config:toml:3.8.0")

    // JEI (fabric) — compile-time only for the plugin package
    compileOnly "mezz.jei:jei-1.21.1-fabric-api:19.21.0.247"
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.21.0.247"

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "org.checkerframework:checker-qual:3.43.0"
    compileOnly "com.google.j2objc:j2objc-annotations:3.0.0"
    compileOnly "com.google.errorprone:error_prone_annotations:2.36.0"

    implementation "com.google.code.gson:gson:2.10.1"
}

processResources {
    def replaceProperties = [
            minecraft_version  : project.minecraft_version,
            loader_version     : project.loader_version,
            mod_id             : project.mod_id,
            mod_name           : project.mod_name,
            mod_version        : project.mod_version,
            version            : project.version,
            mod_license        : project.mod_license,
            mod_authors        : project.mod_authors,
            mod_description    : project.mod_description,
            mod_issue_tracker  : project.mod_issue_tracker,
            mod_display_url    : project.mod_display_url,
            // inner-class names: preserve literal "$X" segments through Groovy template expansion
            BlockStateBase     : '$' + 'BlockStateBase',
            Properties         : '$' + 'Properties',
            Builder            : '$' + 'Builder'
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : mod_name,
                "Specification-Vendor"  : mod_authors,
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : mod_authors
        ])
    }
    exclude('**/*.psd')
    exclude('**/*.bbmodel')
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('copyAnimations', Copy) {
    from layout.projectDirectory.file("src/main/resources/assets/${mod_id}/player_animations/casting_animations.json")
    into layout.projectDirectory.dir("src/main/resources/assets/${mod_id}/animations")
}

tasks.classes.dependsOn(tasks.copyAnimations)
tasks.processResources.dependsOn(tasks.copyAnimations)
tasks.sourcesJar.dependsOn(tasks.copyAnimations)

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
